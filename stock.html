<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
<meta content="#241611" name="theme-color"/>
<title>Остатки</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#241611; --surface:#241811; --surface-2:#2C2015; --ink:#F4ECDF; --muted:#B49C89;
    --line:rgba(200,138,78,0.28); --accent:#C88A4E; --accent-ink:#E8B57E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:linear-gradient(rgba(27,18,13,0.55), rgba(27,18,13,0.55)), url("bg-bar.jpg");
    background-size:420px auto, 420px auto;
    background-position:top center, top center;
    background-repeat:repeat, repeat;
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif;}

  /* Скрытые радио, управляющие вкладками-фильтрами — работают даже без JS. */
  .tab-radio{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;
  }

  header.topbar{
    border-bottom:1px solid var(--line);
    padding:20px 16px 16px;
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:10px; text-align:center;}
  .brand h1{margin:0;}
  .brand-logo{height:28px; width:auto; display:block;}
  .brand .tag{
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em;
    color:var(--accent); text-transform:uppercase;
  }
  .tagline{
    display:block; text-align:center; font-family:'Manrope',sans-serif; font-size:.76rem;
    color:var(--muted); line-height:1.5; margin:0 auto 16px; max-width:340px;
  }

  /* ---------- Вход по анимированному переходу с главной ---------- */
  /* Логотип уже "долетел" на своё место и виден сразу — остальное содержимое
     мягко проявляется вокруг него, без тёмного экрана поверх страницы. */
  .tagline, .pills, main, footer{
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  }
  .pills{ transition-delay:.06s; }
  main{ transition-delay:.12s; }
  footer{ transition-delay:.18s; }
  html.entry-veil .tagline,
  html.entry-veil .pills,
  html.entry-veil main,
  html.entry-veil footer{
    opacity:0; transform:translateY(10px);
  }

  .pills{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}
  .pill{
    flex:0 0 auto; font-family:'Manrope',sans-serif; font-size:.76rem; font-weight:700;
    padding:9px 14px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); white-space:nowrap; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  @media (hover:hover){
    .pill:hover{border-color:var(--accent);}
  }

  main{padding:26px 16px 8px; max-width:560px; margin:0 auto;}

  .demo-box{
    border:1.5px dashed var(--line); border-radius:18px;
    padding:56px 22px 50px; text-align:center;
    background:rgba(244,236,223,0.025);
  }
  .demo-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.13em;
    text-transform:uppercase; color:var(--accent); margin:0 0 14px;
  }
  .demo-title{
    font-family:'Fraunces',serif; font-weight:500; font-size:1.34rem;
    color:var(--ink); margin:0 0 12px; letter-spacing:-.01em;
  }
  .demo-text{
    font-family:'Manrope',sans-serif; font-size:.85rem; color:var(--muted);
    line-height:1.6; max-width:300px; margin:0 auto;
  }

  /* ---------- Вкладки-фильтры на чистом CSS ---------- */
  #tab-sets:checked ~ main .demo-panel:not([data-cat="sets"]){display:none;}
  #tab-sets:checked ~ header label[for="tab-sets"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  #tab-cocktail:checked ~ main .demo-panel:not([data-cat="cocktail"]){display:none;}
  #tab-cocktail:checked ~ header label[for="tab-cocktail"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  #tab-calc:checked ~ main .demo-panel:not([data-cat="calc"]){display:none;}
  #tab-calc:checked ~ header label[for="tab-calc"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}

  /* ---------- Подпись: тап "d.b wish" — контакты проявляются под ней ---------- */
  .sig{border:none; padding:0; margin-top:8px; text-align:center;}
  .sig-input{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;
  }
  .sig-name{
    display:inline-block; cursor:pointer; padding:4px 3px;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .2s ease;
  }
  .sig-logo{height:24px; width:auto; display:block;}
  @media (hover:hover){
    .sig-name:hover{ opacity:.75; }
  }
  .sig-reveal{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    max-height:0; opacity:0; filter:blur(6px); transform:translateY(-4px) scale(.96);
    overflow:hidden; pointer-events:none;
    transition:max-height 1.15s cubic-bezier(.16,1,.3,1),
               opacity 1.05s ease .12s,
               filter 1.05s ease .12s,
               transform 1.1s cubic-bezier(.16,1,.3,1) .08s;
  }
  .sig-input:checked ~ .sig-reveal{
    max-height:70px; opacity:1; filter:blur(0); transform:translateY(0) scale(1);
    pointer-events:auto; margin-top:6px;
  }
  .sig-tg{
    font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:.8rem;
    letter-spacing:.03em; color:var(--accent-ink); text-decoration:none;
    border-bottom:1px dotted var(--line);
  }
  .sig-caption{
    font-family:'Manrope',sans-serif; font-size:.66rem; color:var(--muted);
    max-width:260px; line-height:1.45;
  }
  footer{
    max-width:560px; margin:34px auto 0; padding:0 18px; color:var(--muted);
    font-size:.74rem; line-height:1.5; text-align:center;
  }

  /* ---------- Премиксы Б/А: плашки как в чайной карте, в тёмной палитре ---------- */
  #tab-premix:checked ~ main .demo-panel:not([data-cat="premix"]){display:none;}
  #tab-premix:checked ~ header label[for="tab-premix"]{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .cat-head{display:flex; align-items:center; gap:8px; margin:0 0 6px 2px;}
  .cat-head .dot{width:10px; height:10px; border-radius:50%; background:var(--accent);}
  .cat-head h2{font-size:1.08rem; font-weight:600; margin:0; letter-spacing:-.01em; color:var(--ink);}
  .cat-head .n{font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--muted);}
  .cat-note{font-size:.76rem; color:var(--muted); line-height:1.5; margin:0 2px 14px;}
  details.card{
    display:block; background:var(--surface); border:1px solid var(--line);
    border-left:4px solid var(--dot); border-radius:8px; margin-bottom:9px; overflow:hidden;
    transition:box-shadow .18s ease, transform .18s ease;
  }
  @media (hover:hover){ details.card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.35); transform:translateY(-1px);} }
  summary.card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; padding:12px 12px 10px; list-style:none; -webkit-tap-highlight-color:transparent;
  }
  summary.card-head::-webkit-details-marker{display:none;}
  summary.card-head::marker{content:'';}
  .card-name{font-family:'Fraunces',serif; font-size:1.02rem; font-weight:500; line-height:1.25;}
  .prep-note{font-family:'Manrope',sans-serif; font-size:.76rem; font-weight:400; color:var(--muted); font-style:italic;}
  .chev{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:.85rem; transition:transform .15s ease; flex:0 0 auto;}
  details.card[open] .chev{transform:rotate(180deg);}
  .card-content{height:0; overflow:hidden; transition:height .32s cubic-bezier(.4,0,.2,1);}
  details.card[open] .card-content{height:auto;}
  .card-content-inner{overflow:hidden; contain:content;}
  .badges{display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 11px;}
  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; font-weight:600;
    color:var(--dot); border:1px solid var(--dot); border-radius:4px; padding:2px 7px;
    background:color-mix(in srgb, var(--dot) 10%, transparent);
  }
  .ing-table{width:100%; border-collapse:collapse; font-size:.86rem;}
  .ing-table th{
    text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:.62rem;
    color:var(--muted); padding:6px 8px; border-top:1px solid var(--line);
    background:var(--surface-2); white-space:nowrap;
  }
  .ing-table th:first-child{text-align:left; padding-left:10px;}
  .ing-table td{padding:8px; border-top:1px solid var(--line); vertical-align:top;}
  .ing-table td:first-child{padding-left:10px;}
  .ing-table tr:nth-child(odd) td{background:rgba(255,255,255,0.02);}
  .ing-table tr.total td{font-weight:700; background:color-mix(in srgb, var(--dot) 9%, transparent);}
  .ing-amt{font-family:'IBM Plex Mono',monospace; font-size:.82rem; text-align:right; white-space:nowrap; font-weight:500;}
  .decor-box{margin:12px 12px 12px; padding:9px 11px; background:var(--surface-2); border-radius:6px; border:1px solid var(--line);}
  .decor-title{font-family:'IBM Plex Mono',monospace; font-size:.64rem; font-weight:600; color:var(--dot); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .decor-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
  .decor-list li{display:flex; justify-content:space-between; gap:10px; font-size:.83rem; line-height:1.4;}
  .decor-val{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--muted); white-space:nowrap; text-align:right; flex:0 0 auto;}
  .card-note{margin:0 12px 12px; font-size:.76rem; color:var(--muted); font-style:italic; line-height:1.45;}

  /* аккуратные таблицы на узких экранах */
  .ing-table{table-layout:fixed;}
  .ing-table th, .ing-table td{overflow-wrap:anywhere;}
  .ing-table th{white-space:normal; line-height:1.25; vertical-align:bottom;}
  .ing-table th:first-child, .ing-table td:first-child{width:42%;}
  .ing-table td:not(:first-child), .ing-table th:not(:first-child){padding-right:10px;}

  /* ---------- Назад и переход между картами ---------- */
  .brand{position:relative; --logo-h:28px;}
  .back-btn{
    position:absolute; left:-10px; top:calc((var(--logo-h) - 44px) / 2);
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    color:var(--accent-ink); text-decoration:none; -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
  }
  .back-btn svg{width:11px; height:19px; display:block; transition:opacity .55s cubic-bezier(.22,1,.36,1);}
  .back-btn:active{transform:translateX(-2px);}
  .nav-row{display:flex; justify-content:center; align-items:center; margin-top:2px;}
  .nav-link{
    display:inline-flex; align-items:center; gap:8px; padding:9px 12px;
    color:var(--accent-ink); text-decoration:none; -webkit-tap-highlight-color:transparent;
    transition:opacity .15s ease;
  }
  .nav-link:active{opacity:.5;}
  .nav-logo{
    display:block; height:14px; aspect-ratio:900/113; background-color:currentColor;
    -webkit-mask:url("logo-chai-wide.png") center/contain no-repeat; mask:url("logo-chai-wide.png") center/contain no-repeat;
  }
  .nav-arr{font-family:'IBM Plex Mono',monospace; font-size:1rem; line-height:1;}
  .foot-date{
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px;
  }
  .nav-row{transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);}
  html.entry-veil .nav-row{opacity:0; transform:translateY(10px);}
  html.entry-veil .back-btn svg{opacity:0;}

  /* ---------- Банкетный алкоголь ---------- */
  .brand{--logo-h:24px;}
  .brand-logo{height:24px;}
  .brand-title{margin:0; font-family:'Fraunces',serif; font-weight:500; font-size:1.15rem; line-height:30px; letter-spacing:-.01em; color:var(--ink);}
  .search{padding:0 0 12px;}
  .search input{
    width:100%; font:500 .95rem 'Manrope',sans-serif; color:var(--ink); background:var(--surface);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; -webkit-appearance:none; appearance:none;
  }
  .search input::placeholder{color:var(--muted);}
  .search input:focus{outline:none; border-color:var(--accent);}
  .pills.scroll{flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .pills.scroll::-webkit-scrollbar{display:none;}
  button.pill{font-family:'Manrope',sans-serif;}
  .pill.on{background:var(--accent); border-color:var(--accent); color:var(--bg);}
  .search, .pills{transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);}
  html.entry-veil .search{opacity:0; transform:translateY(10px);}
  .demo-panel{margin-bottom:22px;}
  .item{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--dot); border-radius:8px;
    padding:11px 12px; margin-bottom:8px;
  }
  .it-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .it-name{font-family:'Fraunces',serif; font-size:1rem; font-weight:500; line-height:1.25;}
  .it-sub{font-size:.68rem; color:var(--muted); line-height:1.35; opacity:.9;}
  .it-sup{font-family:'Manrope',sans-serif; font-size:.86rem; font-weight:700; color:var(--accent-ink); line-height:1.25;}
  .it-note{align-self:flex-start; margin-top:2px; font-family:'IBM Plex Mono',monospace; font-size:.64rem; font-weight:600; color:var(--accent-ink); border:1px solid var(--accent); border-radius:4px; padding:2px 6px;}
  .it-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.92rem; color:var(--accent-ink); white-space:nowrap; flex:0 0 auto;}
  .empty{text-align:center; color:var(--muted); font-size:.85rem; padding:30px 0;}
  .empty[hidden]{display:none;}
  .item[hidden]{display:none !important;}

  /* ---------- Инвента ---------- */
  .brand{--logo-h:30px;}
  .inv-meta{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 0 10px;}
  .inv-meta input{font:500 .9rem 'Manrope',sans-serif; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; min-width:0; -webkit-appearance:none; appearance:none;}
  .inv-meta input:focus{outline:none; border-color:var(--accent-ink);}
  .inv-mode{display:flex; align-items:center; gap:10px; margin:0 0 16px; font-size:.8rem; color:var(--muted); line-height:1.35;}
  .inv-mode input{width:20px; height:20px; accent-color:var(--accent-ink); flex:0 0 auto;}
  .item{flex-wrap:wrap; align-items:center;}
  .it-main{flex:1 1 120px; min-width:0;}
  .inv-fields{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; flex:0 0 auto; align-items:flex-start;}
  .inv-fld{display:flex; flex-direction:column; gap:3px; align-items:flex-end;}
  .inv-fld label{font-family:'IBM Plex Mono',monospace; font-size:.56rem; letter-spacing:.04em; color:var(--muted);}
  .inv-in{width:88px; font:600 1rem 'IBM Plex Mono',monospace; text-align:right; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; -webkit-appearance:none; appearance:none;}
  .inv-in:focus{outline:none; border-color:var(--accent-ink); background:var(--surface);}
  .inv-in.has{border-color:var(--accent-ink); background:var(--surface);}
  .inv-row{display:flex; gap:6px; align-items:center;}
  .inv-plus{width:36px; height:42px; font:700 1.2rem 'Manrope',sans-serif; line-height:1; color:var(--accent-ink); background:var(--surface); border:1.5px solid var(--line); border-radius:8px; padding:0; -webkit-tap-highlight-color:transparent;}
  .inv-plus:active{background:var(--surface-2);}
  .v-sum{min-height:.9rem; font-family:'IBM Plex Mono',monospace; font-size:.78rem; font-weight:600; color:var(--accent-ink);}
  .inv-bd{display:none;} body.monthly .inv-bd{display:flex;}
  .inv-tare-btn{align-self:flex-start; margin-top:4px; font:600 .7rem 'Manrope',sans-serif; color:var(--accent-ink); background:none; border:1px solid var(--accent); border-radius:6px; padding:3px 8px;}
  .inv-tare{flex:1 0 100%; display:flex; gap:10px; align-items:flex-end; padding-top:10px; margin-top:10px; border-top:1px dashed var(--line);}
  .inv-tare[hidden]{display:none;}
  .inv-res{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--accent-ink); padding-bottom:10px;}
  .inv-reset{display:block; margin:8px auto 0; background:none; border:none; color:var(--muted); font:600 .78rem 'Manrope',sans-serif; text-decoration:underline; padding:10px;}
  main{padding-bottom:130px;}
  .inv-dock{position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; gap:12px; align-items:center; justify-content:space-between; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to bottom, rgba(36,22,17,0), var(--bg) 38%);}
  .inv-prog{font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--muted);}
  .inv-send{font:700 .95rem 'Manrope',sans-serif; color:var(--bg); background:var(--accent-ink); border:none; border-radius:12px; padding:13px 20px; box-shadow:0 8px 18px -8px rgba(50,35,35,.55);}
  .inv-modal{position:fixed; inset:0; z-index:100; background:rgba(40,28,28,.45); display:flex; align-items:flex-end; justify-content:center;}
  .inv-modal[hidden]{display:none;}
  .inv-sheet{width:100%; max-width:520px; background:var(--bg); border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px;}
  .inv-sheet h3{margin:0; font-family:'Fraunces',serif; font-weight:500; font-size:1.2rem;}
  .inv-sheet p{margin:0 0 4px; font-size:.84rem; color:var(--muted); line-height:1.4; word-break:break-word;}
  .inv-sheet button{font:700 .95rem 'Manrope',sans-serif; border-radius:12px; padding:13px; border:1.5px solid var(--accent-ink); background:var(--surface); color:var(--accent-ink);}
  .inv-sheet button.main{background:var(--accent-ink); color:var(--bg);}
  .inv-kp{position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--bg); border-top:1px solid var(--line); padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 24px -14px rgba(50,35,35,.5); user-select:none; -webkit-user-select:none;}
  .inv-kp[hidden]{display:none;}
  .kp-top{display:flex; align-items:center; gap:10px; padding:2px 4px 8px;}
  .kp-name{flex:1; min-width:0; font-family:'Fraunces',serif; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kp-sum{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem; color:var(--accent-ink);}
  .kp-done{font:700 .85rem 'Manrope',sans-serif; color:var(--accent-ink); background:none; border:none; padding:6px 8px;}
  .kp-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .kp-grid button{font:600 1.35rem 'IBM Plex Mono',monospace; height:50px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .kp-grid button:active{background:var(--surface-2);}
  .kp-grid .op{color:var(--accent-ink); background:var(--surface-2);}
  .kp-grid .next{grid-column:span 2; background:var(--accent-ink); color:var(--bg); border-color:var(--accent-ink); font:700 1rem 'Manrope',sans-serif;}
  body.kp-open .inv-dock{display:none;}
  body.kp-open main{padding-bottom:360px;}
  .inv-in.act{border-color:var(--accent-ink); background:var(--surface); box-shadow:0 0 0 3px rgba(107,88,88,.2);}
  /* ---------- Как в чайной карте: компактные позиции ---------- */
  main{padding:14px 14px 130px;}
  body.kp-open main{padding-bottom:300px;}
  .search input{padding:9px 12px; font-size:.9rem; border-radius:9px;}
  .pills.scroll{flex-wrap:wrap; overflow:visible; gap:7px;}
  .pill{font-size:.68rem; padding:5px 9px; border-radius:7px; border:1.5px solid var(--line);}
  .pill.on{border-color:var(--accent-ink);}

<script>
(function(){
  // Если пришли по анимированному переходу с главной — логотип уже на месте,
  // его не прячем вообще. Прячем только остальное содержимое (класс на <html>,
  // задаётся синхронно до первой отрисовки) и мягко проявляем его чуть позже —
  // без единого тёмного кадра поверх страницы.
  var entering = false;
  try{ entering = sessionStorage.getItem('fly:stock.html') === '1'; sessionStorage.removeItem('fly:stock.html'); }catch(e){}
  if(entering){
    document.documentElement.classList.add('entry-veil');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function reveal(){ document.documentElement.classList.remove('entry-veil'); }
    if(reduceMotion){ reveal(); }
    else{
      window.addEventListener('load', function(){
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(reveal, 90); }); });
      });
    }
  }
})();
</script>

<script>
(function(){
  var CATCOL={strong:'#C88A4E',wine:'#B5495B',beer:'#E0A458',soft:'#8FB7D4',bar:'#B889B8',food:'#7FB08A',pf:'#C27C4A'};
  function $(id){ return document.getElementById(id); }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
  function norm(s){ return (s||'').toLowerCase().replace(/ё/g,'е'); }

  var st=null, T={sup:{},ded:{},cor:{}}, entries=[], rowsAll=[], secs=[], mode='view', cat='all';

  // ---------- расчёт остатка: инвента + поставки − списания + ручные правки ----------
  function agg(){
    T={sup:{},ded:{},cor:{}};
    (st.supplies||[]).forEach(function(x){ T.sup[x.k]=(T.sup[x.k]||0)+x.q; });
    (st.deductions||[]).forEach(function(x){ T.ded[x.k]=(T.ded[x.k]||0)+x.q; });

  }
  function cur(key,base){ return Math.round((base+(T.sup[key]||0)-(T.ded[key]||0)+(T.cor[key]||0))*1000)/1000; }
  function stat(key,c){

  // ---------- вывод ----------

  function stClass(s){ return 'st-'+s; }

  function normNote(n){ if(!n) return ''; var a=[]; if(n.min!=null) a.push('норма '+fmt(n.min)); if(n.crit!=null) a.push('крит. '+fmt(n.crit)); return a.join(' · '); }
  function lowOf(r){ return r.stat&&(r.stat.s==='low'||r.stat.s==='crit'); }

  function orderLines(){

  // ---------- заказ ----------

  }
  // ---------- правка (только админ) ----------
  function editDialog(key,name,u,c,isGroup){

    if(!isGroup) html+='<label>Остаток сейчас, '+u+'</label><input id="e-q" type="text" inputmode="text" autocomplete="off"/><label>Норма: до скольки довозить, '+u+'</label><input id="e-min" type="text" inputmode="text" autocomplete="off" placeholder="не задана"/><label>Критический остаток, '+u+'</label><input id="e-crit" type="text" inputmode="text" autocomplete="off" placeholder="не задан"/>';
    html+='<p class="err" id="e-err"></p>'+(isGroup?'':'<button class="main" id="e-save">Сохранить</button>')+'<button id="e-hide"></button><button id="e-x">Отмена</button>';
    var d=HIP.dialog(html), E=d.el, err=E.querySelector('#e-err');
    E.querySelector('h3').textContent=name; E.querySelector('.cur').textContent=isGroup?'Скрыть или показать всю группу.':'Сейчас по расчёту: '+fmt(c)+' '+u;
    E.querySelector('#e-hide').textContent=isH?'Показать позицию':'Скрыть позицию'; E.querySelector('#e-x').onclick=d.close;

      var qv=q===''?null:P(q), mv=mn===''?null:P(mn), cv=cr===''?null:P(cr);
      if((q!==''&&qv===null)||(mn!==''&&mv===null)||(cr!==''&&cv===null)){ err.className='err'; err.textContent='Не получилось прочитать число.'; return; }

    };
  }
  // ---------- режимы ----------
  var pills=document.querySelectorAll('#pills .pill');
  function setCat(c){ cat=c; pills.forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-cat')===c); }); }

    $('ttl').textContent=want?'Правка остатков':'Остатки'; $('send').textContent=want?'Готово':'Список заказа';

  }
  window.addEventListener('hashchange',setMode); HIP.onChange=setMode;
  // «назад» в режиме правки возвращает к остаткам, а не уводит с страницы
  var bb=$('backBtn'); if(bb) bb.addEventListener('click',function(e){ if(mode==='edit'){ e.preventDefault(); e.stopImmediatePropagation(); location.hash=''; } },true);
  $('send').addEventListener('click',function(){ if(mode==='edit') location.hash=''; else if(st&&st.baseline) orderDialog(); });
  $('q').addEventListener('input',function(){ if(this.value.trim()!==''&&cat!=='all') setCat('all'); apply(); });

  pills.forEach(function(b){ b.addEventListener('click',function(){ setCat(b.getAttribute('data-cat')); $('q').value=''; apply(); window.scrollTo(0,0); }); });
  // ---------- поставки (только админ) ----------
  var SP=$('sp'), SPSC=$('spSc'), spQ=$('spQ'), spRes=$('spRes'), spForm=$('spForm'), spDraftBox=$('spDraftBox'), spDraft=$('spDraft'), spDock=$('spDock'), spSave=$('spSave'), spMsg=$('spMsg'), spLog=$('spLog'), spLogH=$('spLogH');
  var rootEl=document.documentElement; rootEl.appendChild(SP);
  var VOLS=[0.5,0.7,0.75,1], draft=[], pick=null, pvol=null, pcustom=false, pqty='', saving=false;
  var spCur=null, spLayer=0, spPushed=0, spSelfPop=false, spAnim=null, SP_MS=520, SP_EASE='cubic-bezier(.32,.08,.24,1)', SP_SHADOW='-14px 0 36px rgba(0,0,0,.18)';
  function lsg(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function r3(x){ return Math.round(x*1000)/1000; }
  function liters(o){ return o&&o.u==='л'; }
  function nameOf(k){
    for(var i=0;i<entries.length;i++){ var e=entries[i]; if(e.key===k) return e.n; if(e.subs) for(var j=0;j<e.subs.length;j++) if(e.subs[j].key===k) return e.n+' · '+e.subs[j].n; }
    return k;
  }
  function spOptions(){

  function buildForm(focusQty){

      var oc=el('button','sp-chip'+(pcustom?' on':''),'другой'); oc.type='button'; oc.addEventListener('click',function(){ pcustom=true; pvol=null; buildForm(false); var vc=$('spVc'); if(vc) vc.focus(); }); cs.appendChild(oc);
      spForm.appendChild(cs);
      if(pcustom){
        var vc=el('input','sp-in'); vc.id='spVc'; vc.type='text'; vc.setAttribute('inputmode','decimal'); vc.setAttribute('autocomplete','off'); vc.placeholder='Объём, л (например 0,33)'; vc.style.marginTop='8px'; if(pvol) vc.value=fmt(pvol);
        vc.addEventListener('input',function(){ var x=vc.value.trim()===''?null:P(vc.value); pvol=(x&&x>0)?x:null; if(pvol) lss('hip:vol:'+o.key,String(pvol)); preview(); });

    }

    slEditBuild(); slEdit.hidden=false; slPick.hidden=true; slList.hidden=true; slInfo.hidden=true; slDock.hidden=true; SLSC.scrollTop=0;
  }
  function slEditHide(){ ed=null; slEdit.hidden=true; slPick.hidden=false; slList.hidden=false; slInfo.hidden=false; renderRep(); }
  function slEditBuild(){
    slEdit.innerHTML=''; var r=ed.row;
    var fh=el('div','sp-fh'), l=el('div'); l.appendChild(el('div','sp-fn',r.d)); l.appendChild(el('div','sp-cur',r.g.replace(/\.$/,'')+' · в отчёте: '+fmt(r.c))); fh.appendChild(l); slEdit.appendChild(fh);
    slEdit.appendChild(el('span','sp-lbl','Что списывать на одну порцию'));
    if(!ed.comps.length) slEdit.appendChild(el('p','sp-hint','Пока ничего. Найди позицию ниже.'));
    ed.comps.forEach(function(c,i){
      var o=slOptMap[c.k], row=el('div','sl-comp'); row.appendChild(el('span','n',o?o.name:c.k));
      var inp=el('input','sp-in'); inp.type='text'; inp.setAttribute('inputmode','decimal'); inp.setAttribute('autocomplete','off'); inp.value=c.val; inp.addEventListener('input',function(){ c.val=inp.value; });
      row.appendChild(inp); row.appendChild(el('span','u',o?dispUnit(o):'')); var rm=el('button','sp-rm','×'); rm.type='button'; rm.addEventListener('click',function(){ ed.comps.splice(i,1); slEditBuild(); }); row.appendChild(rm); slEdit.appendChild(row);
    });
    slEdit.appendChild(el('span','sp-lbl','Добавить позицию'));
    var wrap=el('div','search'), q=el('input'); q.type='search'; q.placeholder='Найти позицию'; q.setAttribute('autocomplete','off'); wrap.appendChild(q); slEdit.appendChild(wrap);
    var res=el('div'); slEdit.appendChild(res);
    q.addEventListener('input',function(){
      res.innerHTML=''; var tk=norm(q.value).split(/\s+/).filter(Boolean); if(!tk.length) return; var n=0;
      slOpts.forEach(function(o){ if(n>=25) return; var hay=norm(o.name+' '+o.g); if(!tk.every(function(x){ return hay.indexOf(x)>-1; })) return; n++;
        var b=el('button','sp-row'); b.type='button'; b.appendChild(el('span','sp-n',o.name)); b.appendChild(el('span','sp-g',o.g+' · '+o.u));
        b.addEventListener('click',function(){ var pq=portionFor(o,ed.row.d); ed.comps.push({k:o.key,val:pq>0?String(toDisp(o,pq)).replace('.',','):''}); slEditBuild(); }); res.appendChild(b); });
      if(!n) res.appendChild(el('p','sp-hint','Ничего не найдено.'));
    });
    var btns=el('div','sl-btns'), ok=el('button','main','Сохранить'), ig=el('button','','Не списывать'), cn=el('button','','Отмена'); ok.type=ig.type=cn.type='button';
    ok.addEventListener('click',function(){
      var comps=[]; for(var i=0;i<ed.comps.length;i++){ var c=ed.comps[i], o=slOptMap[c.k], v=P(c.val); if(v===null||!(v>0)){ slShow('Укажи число у позиции «'+(o?o.name:c.k)+'».','err'); return; } comps.push({k:c.k,q:Math.round(fromDisp(o,v)*10000)/10000}); }
      if(!comps.length){ slShow('Добавь позицию или нажми «Не списывать».','err'); return; }
      slShow(''); mapDraft[ed.row.key]={c:comps}; spUiBack();
    });
    ig.addEventListener('click',function(){ slShow(''); mapDraft[ed.row.key]={ign:1}; spUiBack(); });
    cn.addEventListener('click',function(){ slShow(''); spUiBack(); });
    btns.appendChild(ok); btns.appendChild(ig); btns.appendChild(cn); slEdit.appendChild(btns);
  }

  // --- загрузка файла ---
  slFile.addEventListener('change',async function(){
    var f=slFile.files&&slFile.files[0]; if(!f) return; slShow('Читаю отчёт…'); 
    try{
      var parsed=parseReport(await readXlsx(await f.arrayBuffer()));
      buildOpts(); rep=parsed; mapDraft={}; slBlock='';
      if(!rep.date) slBlock='Не нашёл дату отчёта, списывать нельзя.';
      else if(st&&st.baseline&&st.baseline.date&&rep.date<=st.baseline.date) slBlock='Инвента сделана '+dateRu(st.baseline.date)+'. Отчёт за '+dateRu(rep.date)+' не позже неё, эти продажи уже учтены в остатках.';
      else if(((st&&st.sales)||[]).some(function(x){ return x.date===rep.date; })) slBlock='Отчёт за '+dateRu(rep.date)+' уже загружен. Чтобы загрузить заново, отмени прежнюю загрузку внизу, иначе остатки спишутся дважды.';
      slShow(''); renderRep();
    }catch(e){ rep=null; renderRep(); slShow((e&&e.message)||'Не получилось прочитать файл.','err'); }
    slFile.value='';
  });

  // --- списание ---
  function moveDlg(d){ rootEl.appendChild(d.el.parentNode); return d; }
  function doApply(){
    var agg={}, newMap={}, dishes=0, portions=0;
    rep.rows.forEach(function(r){ var e=r.eff; if(e.s==='ign'){ newMap[r.key]={ign:1}; return; } if(e.s==='none') return; newMap[r.key]={c:e.m.c.map(function(c){ return {k:c.k,q:c.q}; })}; dishes++; portions+=r.c; e.m.c.forEach(function(c){ agg[c.k]=(agg[c.k]||0)+c.q*r.c; }); });
    var id='i'+Date.now().toString(36), now=new Date().toISOString(), date=rep.date, skipped=rep.cnt.none;
    var deds=Object.keys(agg).map(function(k,i){ return {id:id+'-'+i,imp:id,t:now,k:k,q:Math.round(agg[k]*10000)/10000,d:date}; });
    slBusy=true; slApply.disabled=true; slApply.textContent='Списываю…'; slShow('');
    HIP.update(function(s){
      if((s.sales||[]).some(function(x){ return x.date===date; })) throw new Error('Отчёт за '+dateRu(date)+' уже загружен.');
      s.deductions=(s.deductions||[]).concat(deds); s.salesMap=Object.assign({},s.salesMap||{},newMap);
      s.sales=(s.sales||[]).concat([{id:id,date:date,t:now,dishes:dishes,portions:portions,skipped:skipped}]); return s;
    }).then(function(res){
      st=res; slBusy=false; rep=null; mapDraft={}; render(); renderRep(); renderSlLog(); slShow('Продажи за '+dateRu(date)+' списаны: блюд '+dishes+', порций '+fmt(portions)+(skipped?'. Не настроено и не списано: '+skipped+'.':'.')); SLSC.scrollTop=0;
    }).catch(function(e){ slBusy=false; renderRep(); slShow((e&&e.message)||'Не получилось сохранить.','err'); });
  }
  slApply.addEventListener('click',function(){
    if(slBusy||!rep||slBlock) return;
    if(!HIP.isAdmin()){ slShow('Нужен админ-режим: вернись назад, нажми на подпись d.b wish и войди по ключу.','err'); return; }
    if(rep.cnt.none>0){
      var d=moveDlg(HIP.dialog('<h3>Не всё настроено</h3><p></p><button class="main" id="a-ok">Списать без них</button><button id="a-x">Вернуться</button>'));
      d.el.querySelector('p').textContent='Блюд без настройки: '+rep.cnt.none+'. Они не спишутся из остатков. Продолжить?';
      d.el.querySelector('#a-x').onclick=d.close; d.el.querySelector('#a-ok').onclick=function(){ d.close(); doApply(); };
    } else doApply();
  });
  function renderSlLog(){
    slLog.innerHTML=''; var list=((st&&st.sales)||[]).slice(-10).reverse(); slLogH.hidden=!list.length;
    list.forEach(function(x){
      var r=el('div','sp-lg'), tx=el('div','t'); tx.appendChild(el('span','','Продажи за '+dateRu(x.date))); tx.appendChild(el('small','','загружено '+when(x.t)+' · блюд '+x.dishes+', порций '+fmt(x.portions)));
      var un=el('button','sp-undo','Отменить'); un.type='button'; un.addEventListener('click',function(){ undoSales(x); }); r.appendChild(tx); r.appendChild(un); slLog.appendChild(r);
    });
  }
  function undoSales(x){
    var d=moveDlg(HIP.dialog('<h3>Отменить загрузку?</h3><p></p><button class="main" id="u-ok">Отменить загрузку</button><button id="u-x">Не надо</button>'));
    d.el.querySelector('p').textContent='Продажи за '+dateRu(x.date)+' вернутся в остатки.'; d.el.querySelector('#u-x').onclick=d.close;
    d.el.querySelector('#u-ok').onclick=function(){
      d.el.querySelector('p').textContent='Отменяю…';
      HIP.update(function(s){ s.deductions=(s.deductions||[]).filter(function(y){ return y.imp!==x.id; }); s.sales=(s.sales||[]).filter(function(y){ return y.id!==x.id; }); return s; })
        .then(function(res){ st=res; render(); renderSlLog(); if(rep) { /* пересчитать блок */ } d.close(); slShow('Загрузка отменена.'); })
        .catch(function(e){ d.el.querySelector('p').textContent=(e&&e.message)||'Не получилось.'; });
    };
  }
  $('slClose').addEventListener('click',spUiBack);
  function slOpen(){
    if(spLayer) return;
    if(!HIP.isAdmin()){ HIP.adminDialog(slOpen); return; }
    if(!st||!st.baseline){ HIP.dialog('<h3>Данных пока нет</h3><p>Сначала отправь инвенту, потом можно загружать продажи.</p>'); return; }
    rep=null; mapDraft={}; ed=null; slBlock=''; slShow(''); slEdit.hidden=true; slPick.hidden=false; slList.hidden=false; slInfo.hidden=false; buildOpts(); renderRep(); renderSlLog();
    spCur=SL; spLayer=1; spLock(); spSlideIn(); SLSC.scrollTop=0;
    try{ history.pushState({sp:1},''); spPushed++; }catch(e){}
  }
  $('slOpen').addEventListener('click',slOpen);
  window._stock={cur:cur,orderLines:orderLines};
  // сначала показываем сохранённую копию (список появляется сразу, без прыжка), потом тихо обновляем свежими данными
  var cs0=null; try{ cs0=JSON.parse(localStorage.getItem('hip:cache:'+HIP.cfg.repo)||'null'); }catch(e){}
  if(cs0&&cs0.baseline){ st=cs0; setMode(); }
  HIP.read().then(function(d){
    if(d&&st&&d.updated===st.updated&&!d.__cached) return;
    st=d; setMode(); if(!st) $('meta').textContent='Данных пока нет. Админ отправляет остатки кнопкой «Отправить в общие остатки» на странице «Инвента бар».';
  }).catch(function(){ if(!st) $('meta').textContent='Не удалось загрузить данные. Проверь интернет.'; });
})();
</script>
<script>
(function(){
  // ---------- Плавный переход между страницами: перелив цвета ----------
  // Уходя со страницы: поверх неё плавно проступает цвет (и узор) карты, в которую
  // идём. Приходя: страница стартует закрытой этим же цветом и плавно проявляется.
  var OWN = 'stock';
  var KEY = 'navfade';
  var FADE_IN = 480, FADE_OUT = 650, OVERSCAN = 24;
  var SKINS = {
    chai: { bg:'#F4ECDF', img:'bg-chai.jpg', tint:'rgba(244,236,223,0.37)', size:'460px auto', theme:'#F4ECDF' },
    bar:  { bg:'#241611', img:'bg-bar.jpg',  tint:'rgba(27,18,13,0.55)',    size:'420px auto', theme:'#241611' },
    stock: { bg:'#241611', img:'bg-bar.jpg', tint:'rgba(27,18,13,0.55)', size:'420px auto', theme:'#241611' },
    home: { bg:'#B39B85', img:'bg-autumn.jpg', tint:'rgba(179,155,133,0)', size:'cover', theme:'#B39B85' }
  };
  var root = document.documentElement;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var ownTheme = themeMeta ? themeMeta.getAttribute('content') : null;
  var leaving = false;

  function reduceMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function makeVeil(to){
    var c = SKINS[to], v = document.createElement('div'), st = v.style;
    v.className = 'nav-veil';
    st.position = 'fixed';
    st.top = st.left = st.right = st.bottom = (-OVERSCAN) + 'px';
    st.zIndex = '2147483000'; st.opacity = '0'; st.pointerEvents = 'none';
    st.backgroundColor = c.bg;
    if(c.img){
      st.backgroundImage = 'linear-gradient(' + c.tint + ',' + c.tint + '), url("' + c.img + '")';
      st.backgroundSize = c.size + ', ' + c.size;
      st.backgroundPosition = 'center ' + OVERSCAN + 'px, center ' + OVERSCAN + 'px';
      st.backgroundRepeat = 'repeat';
    }
    root.appendChild(v);
    return v;
  }
  function dropVeil(v){ if(v && v.parentNode) v.parentNode.removeChild(v); }

  // ----- Горизонтальное смещение (как открытие чата в Telegram) -----
  // Поверх страницы въезжает «лист» с цветом и узором целевой страницы, а сама страница
  // чуть уезжает в противоположную сторону и темнеет. dir: 1 — лист едет справа, -1 — слева.
  var SLIDE_MS = 520;
  function slideOut(to, dir, done){
    var v = makeVeil(to), st = v.style;
    v.classList.add('nav-sheet');
    st.opacity = '1'; st.pointerEvents = 'auto';
    st.transform = 'translateX(' + (dir * 100) + '%)';
    st.boxShadow = (dir > 0 ? '-14px' : '14px') + ' 0 36px rgba(0,0,0,.18)';
    var b = document.body;
    b.style.transition = 'transform ' + SLIDE_MS + 'ms cubic-bezier(.32,.08,.24,1), filter ' + SLIDE_MS + 'ms ease';
    void v.offsetHeight;
    st.transition = 'transform ' + SLIDE_MS + 'ms cubic-bezier(.32,.08,.24,1)';
    requestAnimationFrame(function(){
      st.transform = 'translateX(0)';
      b.style.transform = 'translateX(' + (-dir * 20) + '%)'; b.style.filter = 'brightness(.86)';
    });
    setTimeout(done, SLIDE_MS + 40);
  }
  function resetBody(){
    var bd = document.body; bd.style.transition = 'none'; bd.style.transform = ''; bd.style.filter = '';
    void bd.offsetHeight; bd.style.transition = '';
  }

  // ----- Приход -----
  var flag = null;
  try{ flag = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); }catch(e){}
  if(flag){
    var parts = String(flag).split('|');
    var fresh = (Date.now() - (parseInt(parts[1], 10) || 0)) < 15000;
    if(parts[0] === OWN && fresh && !reduceMotion()){
      var inVeil = makeVeil(OWN);
      inVeil.style.opacity = '1'; inVeil.style.pointerEvents = 'auto';
      root.classList.add('entry-veil');
      var revealed = false;
      var reveal = function(){
        if(revealed) return; revealed = true;
        inVeil.style.transition = 'opacity ' + FADE_OUT + 'ms ease';
        root.classList.remove('entry-veil');
        inVeil.style.opacity = '0';
        setTimeout(function(){ dropVeil(inVeil); }, FADE_OUT + 80);
      };
      window.addEventListener('load', function(){
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(reveal, 140); }); });
      });
      setTimeout(reveal, 3500); // страховка, если load задержался
    }
  }

  // ----- Уход -----
  function onNavClick(e){
    var a = e.currentTarget;
    if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if(reduceMotion()) return;
    var to = a.getAttribute('data-nav');
    if(!SKINS[to]) return;
    e.preventDefault();
    if(leaving) return;
    leaving = true;
    var href = a.getAttribute('href');
    if(themeMeta) themeMeta.setAttribute('content', SKINS[to].theme);
    try{ sessionStorage.setItem(KEY, to + '|' + Date.now()); if(to !== 'home') sessionStorage.setItem('lastCard', to); }catch(err){}
    // между картами — replace: в истории остаётся «главная → карта», и стрелка «назад» всегда ведёт на главную
    slideOut(to, to === 'home' ? -1 : 1, function(){ if(to === 'home'){ window.location.href = href; } else { window.location.replace(href); } });
  }
  var links = document.querySelectorAll('a[data-nav]:not(#backBtn)');
  for(var i = 0; i < links.length; i++){ links[i].addEventListener('click', onNavClick); }


  // Стрелка «назад»: если пришли с главной — это ровно «назад» в браузере,
  // поэтому главная возвращается со своей анимацией (карточка сжимается обратно).
  var backBtn = document.getElementById('backBtn');
  if(backBtn){
    backBtn.addEventListener('click', function(e){
      if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var viaHome = false;
      try{ viaHome = sessionStorage.getItem('fromHome') === '1'; }catch(err){}
      if(viaHome && window.history.length > 1){
        e.preventDefault();
        try{ sessionStorage.setItem(KEY, 'home|' + Date.now()); }catch(err){}
        if(!reduceMotion()){
          if(leaving) return; leaving = true;
          if(themeMeta) themeMeta.setAttribute('content', SKINS.home.theme);
          slideOut('home', -1, function(){ window.history.back(); });
        } else { window.history.back(); }
      } else {
        onNavClick.call(backBtn, e); // открыли карту напрямую — обычный переход в меню
      }
    });
  }

  // Кнопка «назад» вернула страницу из кэша браузера, пока поверх был цвет —
  // плавно убираем его и возвращаем свой цвет системной шторки.
  window.addEventListener('pageshow', function(ev){
    if(!ev.persisted) return;
    leaving = false; resetBody();
    try{ sessionStorage.removeItem(KEY); }catch(err){}
    if(themeMeta && ownTheme) themeMeta.setAttribute('content', ownTheme);
    var old = document.querySelectorAll('.nav-veil');
    for(var j = 0; j < old.length; j++){
      (function(v){
        v.style.pointerEvents = 'none';
        v.style.transition = 'opacity .45s ease';
        v.style.opacity = '0';
        setTimeout(function(){ dropVeil(v); }, 520);
      })(old[j]);
    }
  });
})();
</script>
